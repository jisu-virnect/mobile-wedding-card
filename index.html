         media-swap so the page can paint with system fallbacks first, then
         upgrade to Nanum once the CSS arrives. Keeps LCP fast. -->

      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap"

      media="print"
      onload="this.media='all'"
    />
    <noscript>

        rel="stylesheet"
